<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — SHD Builds</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/shd.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="settingsPage()" x-init="init()" @keydown.window="hotkeys($event)">
<div id="shd-nav"></div>

<main class="mx-auto max-w-7xl px-4 sm:px-8 py-8 space-y-10">

  <!-- ============ 1. ПОДБОР АКТИВНОСТИ (как «Matchmaking Station») ============ -->
  <section class="space-y-3" aria-labelledby="mm-title">
    <h1 id="mm-title" class="panel-title">Станция подбора</h1>

    <div class="grid gap-3 md:grid-cols-[260px_minmax(0,1fr)]">
      <!-- Инфо + отряд -->
      <aside class="frame glass flex flex-col">
        <div class="p-4 border-b border-white/15">
          <p class="text-2xl">Подбор для</p>
          <p class="text-sm text-white/85 mt-1" x-text="activity.title"></p>
        </div>
        <p class="p-4 text-sm text-white/85 leading-relaxed flex-1" x-text="activity.text"></p>
        <div class="border-t border-white/15">
          <template x-for="(p, i) in squad" :key="i">
            <div class="flex items-center gap-3 px-4 h-9 border-b border-white/10 last:border-0 text-sm">
              <i class="w-0.5 h-4" :class="p ? 'bg-shd-gearset' : 'bg-white/15'"></i>
              <span class="w-5 tabular-nums text-white/70" x-text="String(i+1).padStart(2,'0')"></span>
              <span x-show="p" x-text="p"></span>
              <span x-show="!p" class="flex-1 text-center text-white/40 text-lg leading-none">×</span>
            </div>
          </template>
        </div>
      </aside>

      <!-- Плитки -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5" role="group" aria-label="Активность">
        <template x-for="t in tiles" :key="t.id">
          <button type="button" class="tile-select min-h-[150px] sm:min-h-[170px]" :aria-pressed="selected === t.id" @click="selected = t.id">
            <p class="t-title" x-text="t.title"></p>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" x-html="t.icon"></svg>
            <p class="t-sub" x-text="t.sub"></p>
          </button>
        </template>
      </div>
    </div>
  </section>

  <!-- ============ 2. НАСТРОЙКИ (как меню «Settings» в игре) ============ -->
  <section class="space-y-3" aria-labelledby="set-title">
    <h2 id="set-title" class="panel-title">Настройки</h2>

    <div class="grid gap-3 lg:grid-cols-[240px_minmax(0,1fr)] items-start">
      <!-- Категории: каждая — отдельная панель, активная залита оранжевым -->
      <div class="flex lg:flex-col gap-1 overflow-x-auto no-scrollbar" role="tablist" aria-label="Категории настроек">
        <template x-for="c in categories" :key="c.id">
          <button type="button" role="tab" class="cat-item shrink-0 !w-auto lg:!w-full whitespace-nowrap"
                  :aria-selected="cat === c.id" @click="cat = c.id" x-text="c.label"></button>
        </template>
      </div>

      <!-- Строки -->
      <div role="tabpanel" class="space-y-1.5 min-w-0">
        <template x-for="c in categories" :key="c.id">
          <div x-show="cat === c.id" class="space-y-1.5">
            <template x-for="r in c.rows" :key="r.id">
              <div class="set-row">
                <div class="min-w-0">
                  <p class="r-title" x-text="r.label"></p>
                  <p class="r-desc" x-text="r.desc"></p>
                </div>

                <!-- Вкл / Выкл -->
                <template x-if="r.type === 'switch'">
                  <div class="flex items-center justify-between sm:justify-end gap-3 self-center">
                    <button type="button" class="arrow" :aria-label="r.label + ': включить'" @click="set(c, r, true)">‹</button>
                    <button type="button" role="switch" :aria-checked="!!val(r)" class="w-28 text-center" @click="set(c, r, !val(r))">
                      <span class="opt" :class="val(r) && 'on'">Вкл</span>
                      <span class="text-white/60 mx-1">/</span>
                      <span class="opt" :class="!val(r) && 'on'">Выкл</span>
                    </button>
                    <button type="button" class="arrow" :aria-label="r.label + ': выключить'" @click="set(c, r, false)">›</button>
                  </div>
                </template>

                <!-- ‹ 030 › + полоса -->
                <template x-if="r.type !== 'switch'">
                  <div class="flex flex-col items-stretch self-end">
                    <div class="flex items-center justify-between">
                      <button type="button" class="arrow" :disabled="val(r) <= r.min" :aria-label="'Уменьшить: ' + r.label" @click="nudge(c, r, -1)">‹</button>
                      <span class="val"><span x-text="pad(r)"></span><span class="text-xs text-white/50 ml-1" x-text="r.unit"></span></span>
                      <button type="button" class="arrow" :disabled="val(r) >= r.max" :aria-label="'Увеличить: ' + r.label" @click="nudge(c, r, 1)">›</button>
                    </div>
                    <input type="range" class="hud-range w-[70%] self-center" :min="r.min" :max="r.max" :step="r.step"
                           :aria-label="r.label" :value="val(r)" :style="`--p:${pct(r)}%`"
                           @input="set(c, r, +$event.target.value)">
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Подсказки клавиш -->
        <div class="flex flex-wrap items-center justify-between gap-3 pt-2 text-sm">
          <p class="text-white/60" x-text="status"></p>
          <div class="flex flex-wrap items-center gap-5">
            <button type="button" class="flex items-center gap-2 text-white/85 hover:text-white" @click="resetCat()"><span class="keycap">R</span>Сбросить раздел</button>
            <button type="button" class="flex items-center gap-2 text-white/85 hover:text-white" @click="save()"><span class="keycap is-accent">↵</span>Применить</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 3. ПРОФИЛЬ БИЛДА ============ -->
  <section class="space-y-3">
    <h2 class="panel-title">Профиль билда</h2>
    <div class="grid gap-1.5 md:grid-cols-3">
      <template x-for="s in summary" :key="s.id">
        <div class="panel !p-4 space-y-3">
          <div class="flex items-center justify-between">
            <p class="flex items-center gap-2 text-sm"><i class="w-1.5 h-1.5 rotate-45" :style="`background:${s.color}`"></i><span x-text="s.label"></span></p>
            <p class="text-xl tabular-nums" x-text="String(s.score).padStart(3,'0')"></p>
          </div>
          <div class="stat-bar"><span :style="`width:${s.score}%; background:${s.color}`"></span></div>
          <p class="text-sm text-white/70 leading-snug" x-text="s.note"></p>
        </div>
      </template>
    </div>
  </section>
</main>

<footer class="mx-auto max-w-7xl px-4 sm:px-8 pb-8 text-sm text-white/60">
  SHD Builds · фанатский проект, не связан с Ubisoft · настройки хранятся только в этом браузере
</footer>

<script>
/* ===== Иконки плиток ===== */
const ICONS = {
  random: '<path d="M9 9a3 3 0 116 0c0 2-3 2.5-3 5M12 17.5v.5"/>',
  mission:'<path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z"/><path d="M12 8l4 2.3v4.6L12 17l-4-2.1v-4.6z"/>',
  bounty: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5l4.5 4.5-4.5 4.5L7.5 12z"/>',
  world:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  dz:     '<circle cx="12" cy="12" r="2"/><path d="M12 10V4a6 6 0 016 3.5M13.7 13l5.2 3a6 6 0 01-6.9 4M10.3 13l-5.2 3A6 6 0 016 7.5"/>',
  call:   '<path d="M12 5v9M12 18v1"/><path d="M4 8l2 1M20 8l-2 1M3 14h2M21 14h-2M6 19l1.5-1M18 19l-1.5-1"/>',
  raid:   '<path d="M12 2l9 4v6c0 5-4 9-9 10-5-1-9-5-9-10V6z"/>',
  summit: '<path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/>',
  count:  '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
};

/* ===== Характеристики ===== */
const CATEGORIES = [
  { id:'offense', label:'Нападение', rows:[
    { id:'chc', label:'Шанс крит. попадания', desc:'Выше 60% не работает', min:0, max:60,  step:1, unit:'%', def:50 },
    { id:'chd', label:'Урон крит. попадания', desc:'Главный множитель DPS', min:0, max:200, step:1, unit:'%', def:120 },
    { id:'hsd', label:'Урон в голову',        desc:'Для точных стволов',    min:0, max:150, step:1, unit:'%', def:40 },
    { id:'wd',  label:'Урон оружия',          desc:'Ядра и бренды',          min:0, max:120, step:5, unit:'%', def:90 },
  ]},
  { id:'defense', label:'Защита', rows:[
    { id:'armor', label:'Общая броня',       desc:'Бонус от брендов',       min:0, max:50,  step:1, unit:'%', def:10 },
    { id:'regen', label:'Регенерация брони', desc:'Процентов в секунду',    min:0, max:5,   step:0.1, unit:'%/с', def:0 },
    { id:'haz',   label:'Защита от угроз',   desc:'Горение, кровотечение',  min:0, max:60,  step:1, unit:'%', def:20 },
    { id:'hp',    label:'Здоровье',          desc:'Бонус к здоровью',       min:0, max:120, step:5, unit:'%', def:90 },
  ]},
  { id:'skill', label:'Навыки', rows:[
    { id:'tier',  label:'Уровень навыков',   desc:'Жёлтые ядра',            min:0, max:6,   step:1, unit:'', def:0 },
    { id:'haste', label:'Ускорение навыков', desc:'Сокращение перезарядки', min:0, max:100, step:1, unit:'%', def:0 },
    { id:'sdmg',  label:'Урон навыков',      desc:'Турели, дроны, пчёлы',   min:0, max:100, step:1, unit:'%', def:0 },
    { id:'rep',   label:'Ремонт навыками',   desc:'Хил брони союзников',    min:0, max:150, step:5, unit:'%', def:0 },
  ]},
  { id:'weapon', label:'Оружие', rows:[
    { id:'rof',  label:'Скорострельность',     desc:'Быстрее набор стаков',      min:0, max:50,  step:1, unit:'%', def:15 },
    { id:'wh',   label:'Обращение с оружием',  desc:'Точность, смена, наводка',  min:0, max:100, step:1, unit:'%', def:15 },
    { id:'stab', label:'Стабильность',         desc:'Отдача',                    min:0, max:100, step:1, unit:'%', def:30 },
    { id:'rld',  label:'Скорость перезарядки', desc:'Время перезарядки',         min:0, max:100, step:1, unit:'%', def:10 },
  ]},
  // Эта категория меняет вид всего сайта
  { id:'ui', label:'Интерфейс', ui:true, rows:[
    { id:'glass',  label:'Затемнение панелей', desc:'Плотность «стекла»',             min:10, max:90, step:1, unit:'%' },
    { id:'blur',   label:'Размытие фона',      desc:'Сила размытия сцены за панелями', min:0,  max:30, step:1, unit:'px' },
    { id:'motion', label:'Анимация фона',      desc:'Плавный дрейф света',             type:'switch' },
  ]},
];

function settingsPage() {
  return {
    tiles: [
      { id:'random',  icon:ICONS.random,  title:'Случайная активность', sub:'Любой режим',        text:'Найти других агентов для случайной активности.' },
      { id:'mission', icon:ICONS.mission, title:'Случайная миссия',     sub:'Основные миссии',    text:'Случайная основная миссия с подбором группы.' },
      { id:'bounty',  icon:ICONS.bounty,  title:'Случайная награда',    sub:'Охота за головами',  text:'Выследить и устранить цель награды вместе с отрядом.' },
      { id:'world',   icon:ICONS.world,   title:'Открытый мир',         sub:'Исследование',       text:'Свободное исследование: контрольные точки, события и тайники.' },
      { id:'dz',      icon:ICONS.dz,      title:'Тёмная зона',          sub:'PvPvE',              text:'Зона повышенной опасности: лут, эвакуации и другие агенты.' },
      { id:'call',    icon:ICONS.call,    title:'Ответить на зов',      sub:'Помощь агентам',     text:'Присоединиться к агенту, который запросил подкрепление.' },
      { id:'raid',    icon:ICONS.raid,    title:'Рейды',                sub:'8 агентов',          text:'Командная операция для восьми агентов с механиками боссов.' },
      { id:'summit',  icon:ICONS.summit,  title:'Саммит',               sub:'100 этажей',         text:'Восхождение по этажам небоскрёба с растущей сложностью.' },
      { id:'count',   icon:ICONS.count,   title:'Обратный отсчёт',      sub:'8 агентов · 15 мин', text:'Удержание точек и эвакуация до истечения таймера.' },
    ],
    squad: ['Агент', null, null, null],
    categories: CATEGORIES,
    selected: 'random',
    cat: 'offense',
    values: {},
    status: 'Изменения не сохранены',

    get activity() { return this.tiles.find(t => t.id === this.selected); },

    init() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('shd-build-prefs') || '{}'); } catch (e) {}
      const ui = SHD_UI.load();
      CATEGORIES.forEach(c => c.rows.forEach(r => {
        this.values[r.id] = c.ui ? ui[r.id] : (saved.values?.[r.id] ?? r.def);
      }));
      if (saved.selected && this.tiles.some(t => t.id === saved.selected)) this.selected = saved.selected;
      if (saved.values) this.status = 'Загружен сохранённый профиль';
    },

    val(r) { return this.values[r.id]; },
    pct(r) { return ((this.values[r.id] - r.min) / (r.max - r.min)) * 100; },
    // «030», как в меню игры; дробные — «2.5»
    pad(r) { const v = this.values[r.id]; return r.step < 1 ? v.toFixed(1) : String(v).padStart(3, '0'); },
    set(c, r, v) {
      if (r.type !== 'switch') v = Math.min(r.max, Math.max(r.min, +(+v).toFixed(2)));
      this.values[r.id] = v;
      this.status = 'Есть несохранённые изменения';
      if (c.ui) this.applyUi();
    },
    nudge(c, r, dir) { this.set(c, r, this.values[r.id] + dir * r.step); },

    applyUi() {
      const v = { glass: this.values.glass, blur: this.values.blur, motion: this.values.motion };
      SHD_UI.apply(v); SHD_UI.save(v);
    },
    resetCat() {
      const c = CATEGORIES.find(x => x.id === this.cat);
      c.rows.forEach(r => { this.values[r.id] = c.ui ? SHD_UI_DEFAULTS[r.id] : r.def; });
      if (c.ui) this.applyUi();
      this.status = `Раздел «${c.label}» сброшен`;
    },
    save() {
      const values = {};
      CATEGORIES.filter(c => !c.ui).forEach(c => c.rows.forEach(r => values[r.id] = this.values[r.id]));
      try { localStorage.setItem('shd-build-prefs', JSON.stringify({ selected: this.selected, values })); } catch (e) {}
      this.applyUi();
      this.status = 'Профиль сохранён · ' + new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
    },
    hotkeys(e) {
      if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input[type=text], input[type=search], textarea')) return;
      const k = e.key.toLowerCase();
      if (k === 'r' || k === 'к') this.resetCat();
      if (e.key === 'Enter' && !e.target.closest?.('button, a')) this.save();
    },

    get summary() {
      const score = id => {
        const c = CATEGORIES.find(x => x.id === id);
        const avg = c.rows.reduce((s, r) => s + (this.values[r.id] - r.min) / (r.max - r.min), 0) / c.rows.length;
        return Math.round((avg || 0) * 100);
      };
      const o = score('offense'), d = score('defense'), s = score('skill');
      return [
        { id:'o', label:'Нападение', color:'#e8483b', score:o, note: o > 65 ? 'Чистый DPS — стеклянная пушка.' : 'Урон средний, есть запас на усиление.' },
        { id:'d', label:'Защита',    color:'#3b8fe8', score:d, note: d > 50 ? 'Выживаемость на уровне танка.' : 'Мало брони: играйте от укрытий.' },
        { id:'s', label:'Навыки',    color:'#f2c230', score:s, note: s > 40 ? 'Навыки — основной источник урона или хила.' : 'Навыки вспомогательные.' },
      ];
    },
  };
}
</script>
</body>
</html>
